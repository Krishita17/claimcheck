name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run tests
        run: python -m pytest -q

      - name: Regenerate data and benchmark (offline / mock)
        run: |
          python -m claimcheck.data.generate --out samples --seeds 0 1 2
          python experiments/benchmark.py --samples samples --out results

      - name: ClaimCheck self-scan (SARIF, non-blocking demo)
        run: |
          claimcheck scan samples/acme \
            --oracle samples/acme.oracle.json \
            --config samples/acme.config.json \
            --format sarif -o claimcheck.sarif
          echo "Generated claimcheck.sarif"

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: claimcheck-sarif-${{ matrix.python-version }}
          path: claimcheck.sarif
