[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimcheck"
version = "0.1.0"
description = "Defensive, read-only dependency-confusion exposure checker for internal PyPI/npm packages"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishita Sanjay Choksi" }]
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]
keywords = [
  "dependency-confusion",
  "supply-chain-security",
  "pypi",
  "npm",
  "devsecops",
  "sca",
  "sarif",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Intended Audience :: Developers",
]

[project.optional-dependencies]
live = ["requests>=2.31"]
dev = ["pytest>=7.4"]

[project.scripts]
claimcheck = "claimcheck.cli:main"

[project.urls]
Homepage = "https://github.com/Krishita17/claimcheck"
Repository = "https://github.com/Krishita17/claimcheck"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
